name: Social Queue Topup

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = 09:00 Israel daily
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  topup:
    runs-on: ubuntu-latest
    env:
      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify secret
        run: |
          if [ -z "${{ secrets.BUFFER_ACCESS_TOKEN }}" ]; then
            echo "::error::BUFFER_ACCESS_TOKEN secret is not set"
            exit 1
          fi

      - name: Fill gaps + sync state
        run: python3 scripts/fillgap.py

      - name: Topup Instagram queue
        run: |
          python3 scripts/push_instagram.py --topup 2>&1 | tee /tmp/ig-topup.log
          if grep -q "התור מלא" /tmp/ig-topup.log; then
            echo "Instagram queue full (OK)"
          elif grep -q "הכול כבר מתוזמן" /tmp/ig-topup.log; then
            echo "::warning::Instagram: all posts already scheduled — JSON may need refill"
          fi

      - name: Topup LinkedIn + GBP queues
        run: python3 scripts/push_posts.py --topup

      - name: Check publish freshness
        run: |
          python3 -c "
          import sys, time; sys.path.insert(0, 'scripts')
          from push_instagram import gql, ORG, instagram_channel
          from datetime import datetime, timezone
          ch = instagram_channel()
          d = gql('{posts(input:{organizationId:\"%s\",filter:{channelIds:[\"%s\"]}}){edges{node{status sentAt}}}}' % (ORG, ch['id']))
          edges = (d.get('data',{}).get('posts',{}).get('edges') or [])
          sent = [e for e in edges if e['node'].get('sentAt')]
          if not sent:
            print('::error::No sent posts found — channel may be disconnected')
            sys.exit(1)
          last = max(e['node']['sentAt'] for e in sent)
          last_dt = datetime.fromisoformat(last.replace('Z','+00:00'))
          age_h = (datetime.now(timezone.utc) - last_dt).total_seconds() / 3600
          print(f'Last sentAt: {last[:16]} ({age_h:.0f}h ago)')
          if age_h > 26:
            print(f'::error::Instagram publish stale — last sent {age_h:.0f}h ago (>26h)')
            sys.exit(1)
          print('Freshness OK')
          "

      - name: Report all channels
        if: always()
        run: |
          python3 -c "
          import os, json, sys
          sys.path.insert(0, 'scripts')
          from push_instagram import gql, ORG, instagram_channel
          ch = instagram_channel()
          d = gql('{posts(input:{organizationId:\"%s\",filter:{channelIds:[\"%s\"]}}){edges{node{status dueAt}}}}' % (ORG, ch['id']))
          edges = (d.get('data',{}).get('posts',{}).get('edges') or [])
          pending = [e for e in edges if e['node'].get('status') != 'sent']
          last_due = max((e['node']['dueAt'] for e in pending), default='none')
          print('::notice::Instagram: %d pending, last dueAt: %s' % (len(pending), last_due[:16] if last_due != 'none' else 'none'))
          "
          python3 -c "
          import sys; sys.path.insert(0, 'scripts')
          from push_posts import pending_count, LINKEDIN, GBP
          print('::notice::LinkedIn: %d pending' % pending_count(LINKEDIN))
          print('::notice::GBP: %d pending' % pending_count(GBP))
          "
